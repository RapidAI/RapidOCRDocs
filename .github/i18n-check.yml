# Translation pairing and freshness rules for scripts/check_i18n.py.
default_locale: zh

locales:
  en:
    suffix: .en.md
    # These pages are the minimum English surface and block the CI when stale
    # or missing. Add pages here as their translations become mandatory.
    required:
      - index.md
      - quickstart.md
      - install_usage/rapidocr/install.md
      - install_usage/rapidocr/usage.md
      - install_usage/rapidocr/parameters.md
      - install_usage/rapidocr/how_to_use_infer_engine.md
      - install_usage/rapidocr/image_input.md
      - install_usage/rapidocr/how_to_use_offline_model.md
      - install_usage/rapidocr/how_to_use_ppocrv5.md
      - install_usage/rapidocr/how_to_convert_to_markdown.md
      - install_usage/rapidocr/package/build-custom-version-rapidocr-whl.md
      - install_usage/rapidocr_web/usage.md
      - install_usage/rapidocr_api/usage.md
      - model_list.md
      - online_demo.md
      - faq/faq.md
    # Blog posts currently remain in the default language because of the
    # Material blog/i18n compatibility hook.
    exclude:
      - blog/**
      - changelog/**
      - tags.md
